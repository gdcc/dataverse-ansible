---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: rocky9
    image: eniocarboni/docker-rockylinux-systemd:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    groups:
      - dataverse
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/containerd:/var/lib/containerd:rw
    cgroupns_mode: host
    published_ports:
      - "8080:8080"

provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      log_path: ./ansible-output.log
      roles_path: ../../
  inventory:
    links:
      group_vars: ./group_vars/
  playbooks:
    converge: ../../site.yml
verifier:
  name: testinfra
